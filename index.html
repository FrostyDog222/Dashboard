<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
        <title>Personal Dashboard</title>
    </head>
    <body>
        <!-- Top row -->
        <header class="top-row">
            <div class="search-wrap">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input id="crypto-input" type="text" autocomplete="off" placeholder="Search crypto...">
                    <kbd class="search-kbd">/</kbd>
                </div>
                <ul id="crypto-suggestions" class="suggestions" hidden></ul>
            </div>

            <div id="weather" class="card weather-card"></div>
        </header>

        <!-- Crypto watchlist, floats on the left -->
        <div id="crypto" class="card crypto-card"></div>

        <!-- Center clock -->
        <section id="clock">
            <h1 id="time" class="time"></h1>
            <p id="date" class="date"></p>
            <button id="time-format" class="pill">Change Format</button>
        </section>

        <!-- Daily fact -->
        <section id="facts">
            <div class="card fact-card">
                <div class="fact-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"></path></svg>
                </div>
                <div class="fact-body">
                    <h3 class="fact-title">Daily Fact</h3>
                    <p id="random-fact"></p>
                </div>
                <span class="fact-quote">&rdquo;</span>
            </div>
            <button id="new-fact" class="pill pill-accent">
                Get New Fact
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
        </section>

        <a id="author"></a>
        <script src="index.js"></script>
    </body>
</html>
